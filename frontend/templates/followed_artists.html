{% extends "base.html" %}
{% block title %}Followed Artists | PulseBeat{% endblock %}

{% block content %}
<div class="mb-10">
  <p class="text-sm font-semibold text-accent uppercase tracking-wider mb-2">Your Library</p>
  <h2 class="text-4xl font-bold text-primary tracking-tight">Artists you follow</h2>
</div>

<section id="artists">
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
    {% for a in artists %}
    <a class="bg-surface hover:bg-surface-hover rounded-xl p-4 transition-all text-center group block tile-card" data-artist-id="{{ a.artist_id }}" href="{{ url_for('artist_view', artist_id=a.artist_id) }}">
      <div class="w-32 h-32 mx-auto rounded-full bg-surface-active mb-4 overflow-hidden tile-cover bg-cover-center shadow-lg group-hover:shadow-xl transition-shadow"></div>
      <div class="font-semibold text-primary truncate">{{ a.artist_name }}</div>
      <div class="text-xs text-secondary truncate mt-1">{{ a.num_followers }} followers</div>
    </a>
    {% else %}
    <div class="col-span-full py-12 text-center text-muted border border-border border-dashed rounded-xl">
      <div class="text-4xl mb-4"><i class="ri-user-unfollow-line"></i></div>
      <p>You haven't followed any artists yet.</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
