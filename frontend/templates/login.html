<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | PulseBeat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            black: 'var(--color-black)',
            surface: 'var(--color-surface)',
            'surface-hover': 'var(--color-surface-hover)',
            'surface-active': 'var(--color-surface-active)',
            border: 'var(--color-border)',
            accent: 'var(--color-accent)',
            'accent-hover': 'var(--color-accent-hover)',
            'accent-muted': 'var(--color-accent-muted)',
            primary: 'var(--color-text-primary)',
            secondary: 'var(--color-text-secondary)',
            muted: 'var(--color-text-muted)'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="h-screen w-screen bg-black text-primary flex items-center justify-center relative overflow-hidden font-sans">
  
  <!-- Background Decoration -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-accent/20 rounded-full blur-[128px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-accent/10 rounded-full blur-[128px]"></div>
  </div>

  <div class="relative z-10 w-full max-w-md p-8">
    <div class="flex flex-col items-center mb-8">
      <div class="w-20 h-20 mb-6 drop-shadow-[0_0_20px_rgba(139,92,246,0.6)]">
        <img src="{{ url_for('static', filename='art/logo.svg') }}" class="w-full h-full" alt="PulseBeat Logo">
      </div>
      <h1 class="text-3xl font-bold text-center tracking-tight">Log in to PulseBeat</h1>
      <p class="text-secondary mt-2 text-center">Premium music curation.</p>
    </div>

    {% if error %}
    <div class="bg-red-500/10 border border-red-500/50 text-red-500 p-4 rounded-xl mb-6 flex items-center gap-3">
       <i class="ri-error-warning-line text-xl"></i>
       <span class="text-sm font-medium">{{ error }}</span>
    </div>
    {% endif %}

    {% if success %}
    <div class="bg-green-500/10 border border-green-500/50 text-green-500 p-4 rounded-xl mb-6 flex items-center gap-3">
       <i class="ri-checkbox-circle-line text-xl"></i>
       <span class="text-sm font-medium">{{ success }}</span>
    </div>
    {% endif %}

    <div class="bg-surface border border-border p-8 rounded-3xl shadow-2xl">
      <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-secondary mb-2">Email Address</label>
          <div class="relative">
             <i class="ri-mail-line absolute left-4 top-1/2 -translate-y-1/2 text-muted text-lg"></i>
             <input type="email" name="email" required placeholder="user1@example.com" class="w-full bg-black border border-border rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent text-primary placeholder-muted transition-all">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-secondary mb-2">Password</label>
          <div class="relative">
             <i class="ri-lock-line absolute left-4 top-1/2 -translate-y-1/2 text-muted text-lg"></i>
             <input type="password" name="password" required placeholder="password" class="w-full bg-black border border-border rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent text-primary placeholder-muted transition-all">
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-accent hover:bg-accent-hover text-white font-bold transition-all shadow-lg shadow-accent/25 mt-2">
          Log In
        </button>
        <div class="text-center text-sm text-secondary mt-4">
          Don't have an account? <a href="{{ url_for('register') }}" class="text-accent hover:underline font-medium">Sign Up</a>
        </div>
      </form>
    </div>
    
    <div class="mt-8 text-center text-sm text-secondary">
      <p>Test accounts: u1@gmail.com, artist1@gmail.com</p>
      <p>Password: pw1, pw6</p>
    </div>
  </div>

</body>
</html>
