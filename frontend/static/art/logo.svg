<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Left-bottom curve of the heart -->
  <path d="M 50,85 C 34,73 20.5,58 20.5,54.5" stroke="url(#logo-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left-top curve of the heart -->
  <path d="M 20.5,45.5 C 20.5,31 31.5,21 44.5,27 C 47.5,28.5 50,31 50,31" stroke="url(#logo-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right side curve of the heart -->
  <path d="M 50,31 C 50,31 52.5,28.5 55.5,27 C 68.5,21 79.5,31 79.5,49 C 79.5,60 70,72 50,85" stroke="url(#logo-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Heartbeat ECG line -->
  <path d="M 10,50 L 29.5,50 L 35,59 L 41.5,23 L 48.5,77 L 55,36 L 61,50 L 67,50" stroke="url(#logo-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Play button triangle -->
  <polygon points="67,40 82,50 67,60" fill="url(#logo-grad)" />
</svg>
